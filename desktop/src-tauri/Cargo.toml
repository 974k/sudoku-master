[package]
name = "sudoku-master"
version = "0.0.0" # the app version comes from ../package.json (see tauri.conf.json)
description = "Sudoku Master for Windows: an ad-free, offline, private Sudoku game"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "sudoku_master_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-updater = "2.13.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Reads the progress saved by the earlier Electron build (Chromium's LevelDB)
# so players keep it when they move to this version.
rusty-leveldb = "4.0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
